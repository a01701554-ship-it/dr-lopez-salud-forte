  </g>
  <!-- Podcasts Crisp Wordmark in Pure White -->
  <text x="48" y="32" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.4px">Podcasts</text>
</svg>
