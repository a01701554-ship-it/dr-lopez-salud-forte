<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 48" fill="none" role="img" aria-label="Apple Podcasts">
  <defs>
    <linearGradient id="applePodcastsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B83CF4"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
  </defs>
  <!-- Apple Podcasts Official Icon -->
  <g transform="translate(0, 4)">
    <rect width="40" height="40" rx="9" fill="url(#applePodcastsGrad)"/>
    <g fill="#FFFFFF">
      <!-- Outer Sound Wave -->
      <path d="M20 7c-7.2 0-13 5.8-13 13 0 5.8 3.8 10.7 9.3 12.3v-2.6c-4-1.4-6.8-5.2-6.8-9.7 0-5.8 4.7-10.5 10.5-10.5s10.5 4.7 10.5 10.5c0 4.5-2.8 8.3-6.8 9.7v2.6c5.5-1.6 9.3-6.5 9.3-12.3 0-7.2-5.8-13-13-13z"/>
      <!-- Inner Sound Wave -->
